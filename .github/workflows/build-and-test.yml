name: Build & Test (Mule app)

# Builds the Mule app the way a real consumer does:
#   - the custom plugin is RESOLVED from GitHub Packages (not built here)
#   - AWS access uses GitHub OIDC -> an IAM role (no static keys)
#   - the plugin downloads the keystore from a REAL S3 bucket during the build
#
# Required repo configuration:
#   Secrets:
#     AWS_ROLE_ARN  - IAM role to assume via OIDC (s3:GetObject on the bucket)
#   Variables (vars.*):
#     AWS_REGION    - e.g. us-east-1
#     TLS_BUCKET    - S3 bucket holding the keystore
#     TLS_KEY       - S3 object key, e.g. mule-app/dev/keystore.jks
#
# Note: resolving the plugin from GitHub Packages uses the built-in GITHUB_TOKEN
# (packages: read) — it can read packages owned by the same account. No extra secret.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # required for AWS OIDC
  contents: read
  packages: read    # resolve the custom plugin from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TLS_BUCKET: ${{ vars.TLS_BUCKET }}
      TLS_KEY:    ${{ vars.TLS_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Sets up JDK 17 AND writes settings.xml with a <server id="github"> for GitHub Packages
      # (which requires auth even to read). The id MUST match the <pluginRepository> id in pom.xml.
      - name: Set up JDK 17 + GitHub Packages auth
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Assume the IAM role via OIDC; exports AWS_* env the AWS SDK default chain reads.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # generate-resources -> custom plugin (from GitHub Packages) downloads the keystore
      # from the real bucket -> Mule packages the app -> MUnit runs.
      - name: Build & test the Mule app
        run: >-
          mvn -B clean package
          -Dtls.bucket=${TLS_BUCKET}
          -Dtls.key=${TLS_KEY}
          -Dtls.region=${AWS_REGION}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert keystore was injected into target/classes
        run: |
          test -f target/classes/certificates/keystore.jks \
            && echo "OK: keystore present in build output" \
            || { echo "FAIL: plugin did not write the keystore"; exit 1; }

      - name: Assert keystore was packaged into the artifact
        run: |
          jar tf target/*-mule-application.jar | grep -q 'certificates/keystore.jks' \
            && echo "OK: keystore packaged into deployable artifact" \
            || { echo "FAIL: keystore missing from artifact"; exit 1; }

      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-reports
          path: target/site/munit/
